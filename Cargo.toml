[package]
name = "smartloop-cli"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "smartloop"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
prettytable-rs = "^0.10"
